kind = "web"
previewPath = "/"
title = "PNIGVS — Direction de la Vie Scolaire"
description = "Plateforme Numérique Intégrée de Gestion de la Vie Scolaire — portail public et application métier de la DVS (MENA, Côte d'Ivoire)."
version = "1.0.0"
id = "artifacts/education-portal"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 26270

[services.development]
run = "pnpm --filter @workspace/education-portal run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/education-portal", "run", "build" ]
serve = "static"
publicDir = "artifacts/education-portal/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "26270"
BASE_PATH = "/"
