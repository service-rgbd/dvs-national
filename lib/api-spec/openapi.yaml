          type: string
          format: date-time
        location:
          type: string
          maxLength: 500
      required:
        - type
        - title
    RequestStatus:
      type: string
      enum: [draft, submitted, under_review, forwarded, approved, rejected, cancelled, archived, returned_for_correction]
    WorkflowAction:
      type: string
      enum: [submit, review, forward, approve, publish, reject, cancel, return_for_correction, resubmit, revoke]
    RequestSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/RequestStatus"
        description:
          type: string
          nullable: true
        decisionReason:
