          nullable: true
        establishmentId:
          type: string
          format: uuid
        establishmentName:
          type: string
        activityId:
          type: string
          format: uuid
          nullable: true
        activityTitle:
          type: string
          nullable: true
        checklist:
          type: object
          additionalProperties:
            type: boolean
          description: Checklist établissement (Voyage Découverte, formulaire DVS)
        dvsValidation:
          type: object
          additionalProperties:
            type: boolean
          description: Contrôles internes DVS (prospection, TDR, certificat)
